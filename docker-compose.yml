services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devflow-db:/var/lib/postgresql/data

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/devflow?schema=public
      JWT_SECRET: change-this-to-a-long-random-secret
      FRONTEND_URL: http://localhost:5174
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  devflow-db:
